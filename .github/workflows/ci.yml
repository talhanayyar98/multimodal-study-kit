name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tooling telemetry off: this project should not phone home, even from CI.
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  js:
    name: JS · format, lint, typecheck, build, unit + browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vitest browser mode (core, sensors) and the example e2e need real browsers.
      - run: pnpm --filter @mmstudykit/core exec playwright install --with-deps chromium firefox webkit
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test

  python:
    name: Python ${{ matrix.python }} · mypy, unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    defaults:
      run:
        working-directory: python/mmstudykit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/mmstudykit/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m mypy
      - run: python -m pytest

  roundtrip:
    name: Round trip · TypeScript writes, Python reads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: python/mmstudykit/pyproject.toml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mmstudykit/core exec playwright install --with-deps chromium
      - run: python -m pip install -e "python/mmstudykit[dev]"
      - run: pnpm run build
      - run: pnpm run roundtrip
        env:
          PYTHON: python
